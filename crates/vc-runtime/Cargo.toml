[package]
name = "vc-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
vc-core = { path = "../vc-core" }
vc-llm = { path = "../vc-llm" }
vc-storage = { path = "../vc-storage" }
uuid = { version = "1.8", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
ureq = { version = "2.10", features = ["json"] }
tokio = { version = "1.38", features = ["sync", "time", "rt", "macros"] }
cpal = "0.15"

